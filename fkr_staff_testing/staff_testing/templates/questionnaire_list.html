{% extends "base.html" %}

{% block content %}
    <ul>
        {% for questionnaire in questionnaires %}
        {% if questionnaire.is_published %}
        <li>
            <h2>{{ questionnaire.title }}</h2>
            <p><a href="{% url 'questionnaire' questionnaire.id %}">Приступить к прохождению</a></p>
            {% if not forloop.last %}
            <hr>
            {% endif %}
        </li>
        {% endif %}
        {% endfor %}
    </ul>
{% endblock %}
